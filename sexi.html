<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta http-equiv="x-ua-compatible" content="ie=edge" />
    <title>احدث انوع التشرتات</title>

    <link rel="stylesheet" href=".//css/style.css">
    <!-- MDB icon -->
    <link rel="icon" href="img/mdb-favicon.ico" type="image/x-icon" />
    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <!-- Google Fonts Roboto -->

    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap"
    />
    <!-- MDB -->
    <link rel="stylesheet" href="css/mdb.min.css" />
  </head>
  <body>
    


<div class="container mt-4" dir="rtl">
  <div class="d-flex flex-column flex-md-row align-items-center gap-4">

    <!-- الصور -->
    <div class="w-100 text-center">
      <img id="mainImg" src="img/7.jpg" alt="" class="img-fluid rounded mb-3">

      <div class="d-flex justify-content-center gap-2">
        <img src="./img/38.jpeg"        class="thumb active" alt="صورة 1">
        <img src="/img/39.jpeg"  class="thumb" alt="صورة 2">
        <img src="/img/40.jpeg"        class="thumb" alt="صورة 3">
        <img src="img/41.jpeg" class="thumb" alt="صورة 4">
      </div>
    </div>










<div class="w-100 text-end">

  <!-- ⬇️ الاسم والسعر هنا -->
  <h2 class="fw-bold">تشرت ملون</h2>
  <div class="fs-4 mb-3">
    <span class="text-muted text-decoration-line-through ms-2">600ج.م</span>
    <span class="fw-bold text-success">400ج.م</span>
  </div>


    <!-- التفاصيل -->     
    <div class="w-100 text-end">
      <h6 class="fw-bold">اختار المقاس</h6>
      <select class="form-select mb-3">
        <option>20</option><option>25</option><option>34</option>
        <option>36</option><option>38</option><option>40</option>
      </select>

      <h6 class="fw-bold">اختار الون</h6>
      <select class="form-select mb-3">
        <option>احمر</option><option>ابيض</option>
        <option>اصفر</option><option>اسمر</option>
      </select>

      <h6 class="fw-bold">وصف المنتج</h6>
      <p class="text-muted">نشرت صيفي شيك في الخروج خامة قطن 100%شيك</p>

      <p class="mb-1">🚚 توصيل لكل المحافظات خلال 3–5 أيام</p>
      <p class="mb-1">🔄 استبدال أو استرجاع خلال 14 يوم</p>
      <p class="mb-1">💵 الدفع عند الاستلام</p>

      <a href="./form.html" class="btn btn-primary btn-lg mt - 3 w-100">اشتري الان</a>
    </div>

  </div>
</div>

<style>
  #mainImg {
    width: 100%;
    max-width: 400px;
    aspect-ratio: 1 / 1;
    object-fit: cover;
  }

  .thumb {
    width: 80px;
    aspect-ratio: 1 / 1;
    flex-shrink: 0;
    object-fit: cover;
    border-radius: 6px;
    border: 2px solid #999;
    cursor: pointer;
    opacity: 0.7;
  }
  .thumb.active,
  .thumb:hover {
    border-color: #1266f1;
    opacity: 1;
  }
</style>
<script>
  const mainImg = document.getElementById("mainImg");
  document.querySelectorAll(".thumb").forEach(t => {
    t.addEventListener("click", () => {
      mainImg.src = t.src;
      document.querySelectorAll(".thumb").forEach(x => x.classList.remove("active"));
      t.classList.add("active");
    });
  });
</script>










</body>
</html>
